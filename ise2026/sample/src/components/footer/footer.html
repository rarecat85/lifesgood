<script>
  // Newsletter 
  function changeNewsletterRegion(region, itx_countryId) {
    const countrySelect = document.getElementById('itx_Newsletter_Country');
    const countryWrapper = document.getElementById('newsletter_country');
    const stateWrapper = document.getElementById('newsletter_state');
    const privacyEurope = document.getElementById('newsLetterPrivacyPolicyEurope');
    const privacyGlobal = document.getElementById('newsLetterPrivacyPolicyGlobal');
    const privacyCheck = document.getElementById('itx_Newsletter_PrivacyCheck');
    
    if(region == "") {
      // Reset country select
      countrySelect.innerHTML = '<option value="">Country</option>';
      countryWrapper.classList.add('dimm');
      stateWrapper.classList.add('hidden');
      if(privacyEurope) privacyEurope.classList.add('hidden');
      if(privacyGlobal) privacyGlobal.classList.remove('hidden');
    } else {
      // Fetch countries for selected region
      fetch(`/comm/country/${region}/pardotList.json`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => response.json())
      .then(data => {
        countrySelect.innerHTML = '<option value="">Country</option>';
        
        if(data.countryList && data.countryList.length > 0) {
          data.countryList.forEach(country => {
            const option = document.createElement('option');
            option.value = country.type;
            option.textContent = country.friendlyType;
            countrySelect.appendChild(option);
          });
          
          countryWrapper.classList.remove('dimm');
          
          if(itx_countryId) {
            countrySelect.value = itx_countryId.replace('/', '');
          }
        }
      })
      .catch(error => {
        console.error('Error fetching countries:', error);
        // Fallback: Enable country select anyway
        countryWrapper.classList.remove('dimm');
      });
      
      // Region specific privacy policy
      if (region == "Europe") {
        if(privacyEurope) privacyEurope.classList.remove('hidden');
        if(privacyGlobal) privacyGlobal.classList.add('hidden');
        if(privacyCheck) privacyCheck.checked = false;
      } else {
        if(privacyEurope) {
          privacyEurope.classList.add('hidden');
          const europeCheckbox = privacyEurope.querySelector('input[type=checkbox]');
          if(europeCheckbox) europeCheckbox.checked = false;
        }
        if(privacyGlobal) privacyGlobal.classList.remove('hidden');
      }
      
      // Show/hide state select for North America
      if(region == "North America") {
        stateWrapper.classList.remove('hidden');
        if(itx_countryId) {
          changeNewsletterCountry(itx_countryId);
        }
      } else {
        stateWrapper.classList.add('hidden');
      }
    }
  }
  
  function changeNewsletterCountry(country) {
    const stateSelect = document.getElementById('itx_Newsletter_State');
    const stateWrapper = document.getElementById('newsletter_state');
    
    if(country == 'United States') {
      createNewsletterState();
      stateWrapper.classList.remove('dimm');
      stateWrapper.classList.remove('hidden');
      stateSelect.value = '';
    } else {
      stateSelect.innerHTML = '<option value="">Select one</option>';
      stateWrapper.classList.add('dimm');
      stateSelect.value = '';
    }
  }
  
  function createNewsletterState() {
    const stateArr = ["AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];
    const stateSelect = document.getElementById('itx_Newsletter_State');
    
    stateSelect.innerHTML = '<option value="">Select one</option>';
    stateArr.forEach(state => {
      const option = document.createElement('option');
      option.value = state;
      option.textContent = state;
      stateSelect.appendChild(option);
    });
  }

  // Form submission handler
  document.addEventListener('DOMContentLoaded', function() {
    const newsletterForm = document.getElementById('newsletterForm');
    if(newsletterForm) {
      newsletterForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(newsletterForm);
        const data = Object.fromEntries(formData.entries());
        
        // Validate required fields
        if(!data.Newsletter_Region) {
          alert('Please select a region');
          return;
        }
        if(!data.Newsletter_Country) {
          alert('Please select a country');
          return;
        }
        if(!data.Newsletter_Email) {
          alert('Please enter your email');
          return;
        }
        if(!data.Newsletter_PrivacyCheck && !data.Newsletter_PrivacyCheck_Europe) {
          alert('Please agree to the privacy policy');
          return;
        }
        
        // Submit form (replace with actual endpoint)
        console.log('Newsletter subscription:', data);
        alert('Thank you for subscribing!');
        newsletterForm.reset();
        
        // Reset form UI
        document.getElementById('newsletter_country').classList.add('dimm');
        document.getElementById('newsletter_state').classList.add('hidden');
      });
    }
  });
</script>
